
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: attendx:latest
    container_name: attendx_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - insightface_cache:/root/.insightface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  insightface_cache:
